<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self' ws://127.0.0.1:8787">
  <title>Relay Chat</title>
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; font: 14px system-ui, sans-serif; background: #101214; color: #e6e6e6;
           display: flex; flex-direction: column; height: 100vh; }
    header { display: flex; align-items: center; gap: 12px; padding: 10px 14px;
             border-bottom: 1px solid #26292d; }
    .title { font-weight: 600; }
    .pill { padding: 3px 10px; border-radius: 999px; font-size: 12px;
            border: 1px solid #33373c; }
    .pill .name { font-weight: 600; margin-right: 6px; }
    .pill .status { color: #8b949e; }
    .pill[data-status="idle"] .status { color: #2ecc71; }
    .pill[data-status="thinking"] .status,
    .pill[data-status="awaiting_approval"] .status { color: #e3b341; }
    .pill[data-status="streaming"] .status { color: #58a6ff; }
    .pill[data-status="selectors_stale"] .status { color: #f0883e; }
    .pill[data-status="disconnected"] .status { color: #8b949e; }
    #engine { margin-left: auto; font-size: 12px; color: #9aa0a6;
              display: flex; gap: 6px; align-items: center; }
    #dot { width: 8px; height: 8px; border-radius: 50%; background: #666; }
    #dot.on { background: #2ecc71; }
    #dot.off { background: #e74c3c; }
    #stop { font: inherit; font-size: 12px; padding: 3px 12px; border-radius: 999px;
            border: 1px solid #6e3535; background: #241616; color: #eb9c9c; cursor: pointer; }
    #stop:hover { background: #2e1a1a; }
    #stop:disabled { opacity: 0.45; cursor: default; }
    #banner { padding: 8px 14px; background: #2a1515; color: #f0a9a9;
              border-bottom: 1px solid #442424; font-size: 13px; }
    #banner[hidden] { display: none; }
    #transcript { flex: 1; overflow-y: auto; padding: 14px;
                  display: flex; flex-direction: column; gap: 10px; }
    .msg { max-width: 78%; padding: 8px 12px; border-radius: 10px;
           background: #1b1e21; border: 1px solid #2a2e33; }
    .msg.user { align-self: flex-end; background: #1e2a1e; }
    .msg .sender { font-size: 11px; font-weight: 600; color: #9aa0a6;
                   margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.4px; }
    .msg .body { white-space: pre-wrap; word-break: break-word; }
    .msg .delivery { margin-top: 6px; display: flex; gap: 8px; align-items: center;
                     flex-wrap: wrap; font-size: 12px; color: #9aa0a6; }
    .msg .delivery .delivery-status:empty { display: none; }
    .msg .delivery button { font: inherit; font-size: 12px; padding: 2px 10px;
                            border-radius: 999px; border: 1px solid #33373c;
                            background: #1b1e21; color: #e6e6e6; cursor: pointer; }
    .msg .delivery button:disabled { opacity: 0.45; cursor: default; }
    #pending { font-size: 12px; color: #e3b341; }
    #pending:empty { display: none; }
  </style>
</head>
<body>
  <header>
    <span class="title">Relay Chat</span>
    <span class="pill" id="pill-astra"><span class="name">Astra</span><span class="status">disconnected</span></span>
    <span class="pill" id="pill-codex"><span class="name">Codex</span><span class="status">disconnected</span></span>
    <button id="stop" type="button">Stop</button>
    <span id="pending"></span>
    <span id="engine"><span id="dot"></span><span id="engine-label">connecting…</span></span>
  </header>
  <div id="banner" hidden></div>
  <div id="transcript"></div>
  <script src="dist/renderer.js"></script>
</body>
</html>
